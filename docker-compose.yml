services:
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    container_name: starlab-backend
    image: starlab-backend:latest
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgres://lab:lab1234@postgresql:5432/starlabdb
      - PORT=5001
      - NODE_ENV=production
    volumes:
      - ./apps/backend/uploads:/app/apps/backend/uploads
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    container_name: starlab-frontend
    image: starlab-frontend:latest
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://lab.orignx.dev/api/v1
    depends_on:
      - backend
    restart: unless-stopped
networks:
  default:
    driver: bridge
    name: orignx-network
